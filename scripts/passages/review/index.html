<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhamma Diary · passage review</title>
<!-- Served by server.py. Reads candidates.json, saves to selections.json. -->
<style>
  :root {
    --bg: #121110; --panel: #1b1917; --card: #24211e; --line: #34302b; --ink: #ece6dd;
    --muted: #9a9086; --faint: #6d655d; --accent: #894E26; --accent-ink: #d9a47c;
    --pick: rgba(137, 78, 38, .32); --pick-line: #b46a37; --excerpt: rgba(236, 230, 221, .14);
    --warn: #d0a35a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; display: flex; flex-direction: column; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.link { background: none; border: 0; padding: 0; color: var(--accent-ink); }
  a { color: var(--accent-ink); }
  input[type=text], textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
  input[type=text]:focus, textarea:focus { outline: none; border-color: var(--accent-ink); }
  textarea { resize: vertical; min-height: 64px; }

  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font: 600 16px Georgia, serif; margin: 0; }
  header .tabs { display: flex; gap: 6px; }
  header .counts { color: var(--muted); font-size: 13px; }
  header .save { margin-left: auto; color: var(--muted); font-size: 12px; }

  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 280px minmax(0, 1fr) 400px; }
  main.sequence { display: block; overflow: auto; }

  /* Sutta list */
  #list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  #list .filters { padding: 10px; display: flex; flex-wrap: wrap; gap: 5px; border-bottom: 1px solid var(--line); }
  #list .filters button { font-size: 12px; padding: 3px 8px; }
  #list .filters input { margin-top: 4px; }
  #list ol { list-style: none; margin: 0; padding: 4px; overflow: auto; flex: 1; }
  #list li button { width: 100%; text-align: left; border: 0; background: none; border-radius: 6px; padding: 6px 8px; display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: baseline; }
  #list li button:hover { background: var(--card); }
  #list li button[aria-current="true"] { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  #list .title { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .meta { color: var(--faint); font-size: 11px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--faint); display: inline-block; }
  .dot.include { background: var(--ink); border-color: var(--ink); }
  .dot.maybe { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); border-color: var(--ink); }
  .dot.skip { background: #000; border-color: var(--faint); }

  /* Sutta text */
  #text { overflow: auto; padding: 18px 28px 80px; }
  #text h2 { font: 600 22px Georgia, serif; margin: 0; }
  #text .sub { color: var(--muted); margin: 2px 0 12px; }
  .toolbar { position: sticky; top: -18px; z-index: 2; background: var(--bg); padding: 10px 0; margin-bottom: 6px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .toolbar .hint { color: var(--muted); font-size: 12px; }
  .seg { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 3px 8px; border-left: 3px solid transparent; border-radius: 3px; cursor: pointer; }
  .seg:hover { background: var(--panel); }
  .seg .id { color: var(--faint); font-size: 11px; padding-top: 3px; font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none; }
  .seg .t { font: 16px/1.55 Georgia, serif; }
  .seg.quoted { border-left-color: var(--faint); }
  .seg.quoted .id::after { content: " ✎"; color: var(--muted); }
  .seg.in { background: var(--pick); border-left-color: var(--pick-line); }
  .seg.ex .t { text-decoration: underline; text-decoration-color: var(--ink); text-underline-offset: 4px; }
  .seg.pending { outline: 1px dashed var(--accent-ink); }
  .seg.gap { margin-bottom: 0; }

  /* Edit panel */
  #panel { border-left: 1px solid var(--line); overflow: auto; padding: 16px; background: var(--panel); }
  #panel section { margin-bottom: 18px; }
  #panel h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .status { display: flex; gap: 6px; }
  .status button { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }
  .chip button { border: 0; background: none; padding: 0 6px; color: var(--muted); }
  .warn { color: var(--warn); font-size: 12px; margin-top: 4px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .phone { background: #000; border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
  .phone .eyebrow { color: var(--muted); font-size: 12px; }
  .phone .ptitle { font: 600 18px Georgia, serif; margin: 2px 0 12px; }
  .phone .passage { font: italic 15px/1.55 Georgia, serif; }
  .phone .passage p { margin: 0 0 8px; }
  .phone .ell { color: var(--muted); text-align: center; margin: 0 0 8px; }
  .phone .q { white-space: pre-line; font: 600 18px/1.4 Georgia, serif; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .phone .q.empty { color: var(--faint); font-weight: 400; font-style: italic; }
  .mention { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 6px; font-size: 12px; }
  .mention b { display: block; color: var(--muted); font-weight: 500; margin-bottom: 2px; overflow-wrap: anywhere; }
  .mention p { margin: 2px 0; }
  .row { display: flex; gap: 6px; align-items: center; }

  /* Sequence */
  #seq { max-width: 960px; margin: 0 auto; padding: 18px 16px 80px; }
  #seq p.lead { color: var(--muted); margin-top: 0; }
  #seq ol { list-style: none; margin: 0; padding: 0; }
  #seq li { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
  #seq li.drag-over { border-color: var(--accent-ink); }
  #seq .n { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  #seq .q { color: var(--muted); font-size: 13px; }
  #seq .moves { display: flex; gap: 4px; }
  #seq .moves button { padding: 3px 8px; }
  #seq input.pos { width: 52px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; text-align: right; }
  .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
  .empty-state { color: var(--muted); padding: 40px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>Passage review</h1>
  <div class="tabs">
    <button id="tab-suttas" aria-pressed="true">Suttas</button>
    <button id="tab-seq" aria-pressed="false">Sequence</button>
  </div>
  <div class="counts" id="counts"></div>
  <div class="save" id="save">Loading…</div>
</header>
<main id="main"></main>

<script>
"use strict";
const GUIDE_WORDS = 150, GUIDE_EXCERPT = 200, GUIDE_HIGHLIGHT = 100, MAX_EXCERPT = 340, MAX_HIGHLIGHT = 110; // app test limits
const STOP = new Set(["the", "a", "an", "of", "to", "with", "on", "in", "at", "and", "for", "about", "by", "from"]);
let C = null;          // candidates.json
let S = null;          // selections.json
let byUid = {};
let current = null;    // uid
let view = "suttas";
let filter = "all";
let query = "";
let mode = "ranges";   // or "excerpt"
let pending = null;    // segment index of a half-made range

const $ = (sel, el = document) => el.querySelector(sel);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k.startsWith("aria-")) el.setAttribute(k, String(v));
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
};

// ---------- data helpers ----------
function sel(uid) {
  if (!S.suttas[uid]) {
    const c = byUid[uid];
    const slug = c.title.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
      .split(/[^a-z0-9]+/).filter(w => w && !STOP.has(w)).slice(0, 3).join("-");
    S.suttas[uid] = { status: "", id: `${uid}-${slug}`, shipped: false, ranges: [], excerpt: null, highlight: "", question: "", note: "" };
  }
  return S.suttas[uid];
}
const statusOf = uid => (S.suttas[uid] && S.suttas[uid].status) || "";
const idx = (c, name) => c.segments.findIndex(s => s[0] === name);
function rangeIdx(c, r) { return [idx(c, r.start), idx(c, r.end)]; }
function blocks(c, s) {
  return s.ranges.map(r => { const [a, b] = rangeIdx(c, r); return c.segments.slice(a, b + 1).map(x => x[1]); });
}
const wordCount = bl => bl.flat().reduce((n, t) => n + t.split(/\s+/).filter(Boolean).length, 0);
function normaliseRanges(c, s) {
  const spans = s.ranges.map(r => rangeIdx(c, r)).filter(([a, b]) => a >= 0 && b >= a).sort((x, y) => x[0] - y[0]);
  const merged = [];
  for (const [a, b] of spans) {
    const last = merged[merged.length - 1];
    if (last && a <= last[1] + 1) last[1] = Math.max(last[1], b); else merged.push([a, b]);
  }
  s.ranges = merged.map(([a, b]) => ({ start: c.segments[a][0], end: c.segments[b][0] }));
}
function problems(c, s) {
  const out = [];
  if (!s.ranges.length) out.push("no passage ranges");
  if (!s.excerpt) out.push("no excerpt");
  else {
    const [a, b] = rangeIdx(c, s.excerpt);
    if (!s.ranges.some(r => { const [x, y] = rangeIdx(c, r); return x <= a && b <= y; })) out.push("excerpt isn't inside one range");
  }
  if (!s.highlight.trim()) out.push("no highlight");
  else if (!blocks(c, s).flat().some(t => t.includes(s.highlight.trim()))) out.push("highlight isn't verbatim from one segment of the passage");
  if (s.excerpt) {
    const [a, b] = rangeIdx(c, s.excerpt);
    const n = c.segments.slice(a, b + 1).map(x => x[1]).join(" ").length;
    if (n > MAX_EXCERPT) out.push(`excerpt is ${n} characters (the app allows ${MAX_EXCERPT})`);
  }
  if (s.highlight.trim().length > MAX_HIGHLIGHT) out.push(`highlight is ${s.highlight.trim().length} characters (the app allows ${MAX_HIGHLIGHT})`);
  if (!s.question.trim()) out.push("no question");
  if (!/^[a-z0-9.\-]+$/.test(s.id)) out.push("ID should be lowercase letters, numbers, dots and hyphens");
  const clash = Object.entries(S.suttas).find(([u, o]) => u !== c.uid && o.id === s.id && o.status === "include");
  if (clash) out.push(`ID also used by ${byUid[clash[0]] ? byUid[clash[0]].ref : clash[0]}`);
  return out;
}

// ---------- saving ----------
let saveTimer = null;
function save() {
  $("#save").textContent = "Unsaved…";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const res = await fetch("/api/selections", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(S) });
      $("#save").textContent = res.ok ? "Saved to selections.json" : "Save failed: " + (await res.text());
    } catch (e) { $("#save").textContent = "Save failed: is server.py running?"; }
  }, 500);
}
function setStatus(uid, status) {
  const s = sel(uid);
  s.status = s.status === status ? "" : status;
  S.order = S.order.filter(u => u !== uid);
  if (s.status === "include") S.order.push(uid);
  save(); render();
}

// ---------- rendering ----------
function render() {
  const counts = { include: 0, maybe: 0, skip: 0, "": 0 };
  for (const c of C.suttas) counts[statusOf(c.uid)]++;
  $("#counts").textContent = `${C.suttas.length} suttas · ${counts.include} in the set · ${counts.maybe} maybe · ${counts.skip} skipped · ${counts[""]} to look at`;
  $("#tab-suttas").setAttribute("aria-pressed", view === "suttas");
  $("#tab-seq").setAttribute("aria-pressed", view === "sequence");
  const main = $("#main");
  const keep = view === "suttas" && $("#text") ? $("#text").scrollTop : 0;
  const keepList = $("#list ol") ? $("#list ol").scrollTop : 0;
  main.className = view === "sequence" ? "sequence" : "";
  main.replaceChildren();
  if (view === "sequence") { main.append(renderSequence()); return; }
  main.append(renderList(), renderText(), renderPanel());
  if ($("#text")) $("#text").scrollTop = keep;
  if ($("#list ol")) $("#list ol").scrollTop = keepList;
}

function visibleSuttas() {
  const q = query.trim().toLowerCase();
  return C.suttas.filter(c =>
    (filter === "all" || statusOf(c.uid) === (filter === "todo" ? "" : filter)) &&
    (!q || `${c.ref} ${c.uid} ${c.title} ${c.mentions.map(m => m.note).join(" ")}`.toLowerCase().includes(q)));
}

function renderList() {
  const f = (key, label) => h("button", { "aria-pressed": filter === key, onclick: () => { filter = key; render(); } }, label);
  const search = h("input", { type: "text", placeholder: "Search ref, title or note", value: query,
    oninput: e => { query = e.target.value; const pos = e.target.selectionStart; render(); const i = $("#list input"); i.focus(); i.setSelectionRange(pos, pos); } });
  const items = visibleSuttas().map(c => h("li", {}, h("button", { "aria-current": c.uid === current, onclick: () => open(c.uid) },
    h("span", { class: "dot " + statusOf(c.uid) }),
    h("span", {}, c.ref, c.inSet ? h("span", { class: "badge" }, "in app") : null, h("span", { class: "title" }, c.title)),
    h("span", { class: "meta", title: "notes mentioning it · words in the sutta" }, `${c.mentions.length}✎ ${c.words}w`))));
  return h("nav", { id: "list" },
    h("div", { class: "filters" }, f("all", "All"), f("todo", "To look at"), f("include", "In the set"), f("maybe", "Maybe"), f("skip", "Skipped"), search),
    items.length ? h("ol", {}, items) : h("div", { class: "empty-state" }, "Nothing here."));
}

function renderText() {
  const c = byUid[current];
  if (!c) return h("div", { id: "text" }, h("div", { class: "empty-state" }, "Pick a sutta on the left."));
  const s = S.suttas[current] || { ranges: [], excerpt: null };
  const inRange = new Set(), inEx = new Set();
  for (const r of s.ranges) { const [a, b] = rangeIdx(c, r); for (let i = a; i <= b; i++) inRange.add(i); }
  if (s.excerpt) { const [a, b] = rangeIdx(c, s.excerpt); for (let i = a; i <= b; i++) inEx.add(i); }
  const quoted = new Set(c.quoted);
  const segs = c.segments.map(([id, t], i) => h("div", {
    class: ["seg", quoted.has(id) && "quoted", inRange.has(i) && "in", inEx.has(i) && "ex", pending === i && "pending"].filter(Boolean).join(" "),
    "data-i": i, onclick: () => clickSeg(i) }, h("span", { class: "id" }, id), h("span", { class: "t" }, t)));
  const firstQuoted = c.segments.findIndex(x => quoted.has(x[0]));
  const firstPicked = Math.min(...[...inRange]);
  const jump = i => { const el = $(`.seg[data-i="${i}"]`); if (el) el.scrollIntoView({ block: "center" }); };
  return h("div", { id: "text" },
    h("h2", {}, `${c.ref} · ${c.title}`),
    h("div", { class: "sub" }, `${c.words} words · `, h("a", { href: c.url, target: "_blank", rel: "noopener" }, "SuttaCentral ↗")),
    h("div", { class: "toolbar" },
      h("button", { "aria-pressed": mode === "ranges", onclick: () => { mode = "ranges"; pending = null; render(); } }, "Pick passage"),
      h("button", { "aria-pressed": mode === "excerpt", onclick: () => { mode = "excerpt"; pending = null; render(); } }, "Pick widget excerpt"),
      h("button", { onclick: useSelectionAsHighlight, title: "Select words in the text with the mouse first" }, "Selected words → highlight"),
      firstQuoted >= 0 ? h("button", { onclick: () => jump(firstQuoted) }, "Go to quoted lines ✎") : null,
      inRange.size ? h("button", { onclick: () => jump(firstPicked) }, "Go to passage") : null,
      h("span", { class: "hint" }, pending != null ? "Now click the last segment (Esc to cancel)."
        : mode === "ranges" ? "Click the first segment, then the last. Repeat to add another part."
        : "Click the first and last segment of the short excerpt for the widget.")),
    segs);
}

function clickSeg(i) {
  if (window.getSelection().toString().trim()) return; // selecting words for a highlight
  const c = byUid[current], s = sel(current);
  if (pending == null) { pending = i; render(); return; }
  const [a, b] = [Math.min(pending, i), Math.max(pending, i)];
  pending = null;
  const r = { start: c.segments[a][0], end: c.segments[b][0] };
  if (mode === "ranges") { s.ranges.push(r); normaliseRanges(c, s); if (!s.status) setStatusQuiet(current, "maybe"); }
  else s.excerpt = r;
  save(); render();
}
function setStatusQuiet(uid, st) { sel(uid).status = st; }

function useSelectionAsHighlight() {
  const text = window.getSelection().toString().replace(/\s+/g, " ").trim();
  if (!text) { alertish("Select some words in the sutta text first."); return; }
  sel(current).highlight = text; window.getSelection().removeAllRanges(); save(); render();
}
function alertish(msg) { $("#save").textContent = msg; }

function renderPanel() {
  const c = byUid[current];
  if (!c) return h("aside", { id: "panel" });
  const s = sel(current);
  const st = (key, label) => h("button", { "aria-pressed": s.status === key, onclick: () => setStatus(current, key) }, label);
  const bl = blocks(c, s);
  const words = wordCount(bl);
  const exText = s.excerpt ? c.segments.slice(...(([a, b]) => [a, b + 1])(rangeIdx(c, s.excerpt))).map(x => x[1]).join(" ") : "";
  const field = (key, el) => { el.value = s[key]; el.addEventListener("input", e => { s[key] = e.target.value; save(); refreshPreview(); }); return el; };
  const probs = s.status === "include" ? problems(c, s) : [];
  const pos = S.order.indexOf(current);

  return h("aside", { id: "panel" },
    h("section", {}, h("h3", {}, "Decision"),
      h("div", { class: "status" }, st("include", "In the set"), st("maybe", "Maybe"), st("skip", "Skip")),
      pos >= 0 ? h("div", { class: "note" }, `Night ${pos + 1} of ${S.order.length} (change in Sequence).`) : null,
      s.shipped ? h("div", { class: "note" }, "Already in the app. Its ID is permanent.") : null,
      probs.length ? h("div", { class: "warn" }, "Before export: " + probs.join("; ") + ".") : null),
    h("section", {}, h("h3", {}, "Passage"),
      s.ranges.length ? h("div", { class: "chips" }, s.ranges.map((r, i) => h("span", { class: "chip" }, r.start === r.end ? r.start : `${r.start}–${r.end}`,
        h("button", { title: "Remove", onclick: () => { s.ranges.splice(i, 1); save(); render(); } }, "×"))))
        : h("div", { class: "note" }, "No range yet. Click segments in the text."),
      h("div", { class: words > GUIDE_WORDS * 1.3 ? "warn" : "note" }, `${words} words (about ${GUIDE_WORDS} is the guide)`)),
    h("section", {}, h("h3", {}, "Widget excerpt"),
      s.excerpt ? h("div", { class: "chips" }, h("span", { class: "chip" }, s.excerpt.start === s.excerpt.end ? s.excerpt.start : `${s.excerpt.start}–${s.excerpt.end}`,
        h("button", { title: "Remove", onclick: () => { s.excerpt = null; save(); render(); } }, "×"))) : null,
      h("div", { class: exText.length > MAX_EXCERPT ? "warn" : "note" },
        s.excerpt ? `${exText.length} characters (about ${GUIDE_EXCERPT}, at most ${MAX_EXCERPT}). One range inside the passage.` : "Use “Pick widget excerpt”: one range inside the passage, about 200 characters.")),
    h("section", {}, h("h3", {}, "Highlight (tonight's line)"),
      field("highlight", h("input", { type: "text", placeholder: "Verbatim words from one segment" })),
      h("div", { class: "note", id: "hl-note" })),
    h("section", {}, h("h3", {}, "Question"),
      field("question", h("textarea", { rows: 3, placeholder: "Leave empty and Claude can draft one for you to edit" }))),
    h("section", {}, h("h3", {}, "Preview"), h("div", { id: "preview" })),
    h("section", {}, h("h3", {}, "Passage ID"),
      field("id", h("input", { type: "text", disabled: s.shipped })),
      h("div", { class: "note" }, "Permanent once the passage ships: never reused or renamed.")),
    h("section", {}, h("h3", {}, "Your note"),
      field("note", h("textarea", { rows: 2, placeholder: "Anything to remember (not shipped)" }))),
    h("section", {}, h("h3", {}, `In your vault (${c.mentions.length} notes)`),
      c.mentions.length ? c.mentions.map(m => h("div", { class: "mention" }, h("b", {}, m.note), m.lines.map(l => h("p", {}, l))))
        : h("div", { class: "note" }, "Not mentioned in the vault.")));
}

function refreshPreview() {
  const c = byUid[current], s = sel(current), box = $("#preview");
  if (!box) return;
  const bl = blocks(c, s);
  const passage = h("div", { class: "passage" });
  bl.forEach((b, i) => { if (i) passage.append(h("div", { class: "ell" }, "…")); passage.append(...b.map(t => h("p", {}, t))); });
  box.replaceChildren(h("div", { class: "phone" },
    h("div", { class: "eyebrow" }, `TONIGHT · ${c.ref}`), h("div", { class: "ptitle" }, c.title),
    bl.length ? passage : h("div", { class: "note" }, "Pick a passage in the text."),
    h("div", { class: "q" + (s.question.trim() ? "" : " empty") }, s.question.trim().replace(/\?\s+(?=\p{Lu})/gu, "?\n") || "No question yet.")));
  const note = $("#hl-note"), hl = s.highlight.trim();
  if (note) {
    const ok = hl && bl.flat().some(t => t.includes(hl));
    note.className = (hl && !ok) || hl.length > MAX_HIGHLIGHT ? "warn" : "note";
    note.textContent = !hl ? "Select words in the text, then “Selected words → highlight”. Under about 100 characters."
      : !ok ? "Not found word-for-word inside one segment of the passage."
      : hl.length > MAX_HIGHLIGHT ? `${hl.length} characters: too long, the app allows ${MAX_HIGHLIGHT}.`
      : `${hl.length} characters.`;
  }
}

function renderSequence() {
  const list = h("ol");
  let dragFrom = null;
  S.order.forEach((uid, i) => {
    const c = byUid[uid], s = S.suttas[uid];
    if (!c) return;
    const probs = problems(c, s);
    const move = to => { to = Math.max(0, Math.min(S.order.length - 1, to)); S.order.splice(i, 1); S.order.splice(to, 0, uid); save(); render(); };
    const li = h("li", { draggable: true,
      ondragstart: () => { dragFrom = i; }, ondragover: e => { e.preventDefault(); li.classList.add("drag-over"); },
      ondragleave: () => li.classList.remove("drag-over"),
      ondrop: e => { e.preventDefault(); if (dragFrom != null && dragFrom !== i) { const [u] = S.order.splice(dragFrom, 1); S.order.splice(i, 0, u); save(); render(); } } },
      h("span", { class: "n" }, i + 1),
      h("div", {},
        h("button", { class: "link", onclick: () => { view = "suttas"; open(uid); } }, `${c.ref} · ${c.title}`),
        s.shipped ? h("span", { class: "badge" }, "in app") : null,
        h("div", { class: "q" }, s.question.trim() || "No question yet"),
        probs.length ? h("div", { class: "warn" }, probs.join("; ")) : null),
      h("div", { class: "moves" },
        h("button", { title: "Up", onclick: () => move(i - 1) }, "↑"), h("button", { title: "Down", onclick: () => move(i + 1) }, "↓"),
        h("input", { class: "pos", type: "text", value: i + 1, title: "Type a position and press Return",
          onkeydown: e => { if (e.key === "Enter") move(parseInt(e.target.value, 10) - 1); } })));
    list.append(li);
  });
  const ready = S.order.filter(u => byUid[u] && !problems(byUid[u], S.suttas[u]).length).length;
  const first = S.order[0];
  return h("div", { id: "seq" },
    h("p", { class: "lead" }, `${S.order.length} passages, one a night, so the set loops every ${S.order.length} days. ${ready} are ready to export. Drag rows, use the arrows, or type a position.`),
    first !== "an10.51" ? h("p", { class: "warn" }, "AN 10.51 must stay first: the app's tests check it.") : null,
    S.order.length ? list : h("div", { class: "empty-state" }, "Nothing in the set yet."));
}

function open(uid) { current = uid; pending = null; location.hash = uid; render(); $("#text") && ($("#text").scrollTop = 0); refreshPreview(); }

// ---------- events ----------
$("#tab-suttas").onclick = () => { view = "suttas"; render(); refreshPreview(); };
$("#tab-seq").onclick = () => { view = "sequence"; render(); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && pending != null) { pending = null; render(); refreshPreview(); return; }
  if (view !== "suttas" || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === "j" || e.key === "k") {
    const list = visibleSuttas(), i = list.findIndex(c => c.uid === current);
    const next = list[Math.max(0, Math.min(list.length - 1, i + (e.key === "j" ? 1 : -1)))];
    if (next) open(next.uid);
  }
});
const origRender = render;
render = function () { origRender(); if (view === "suttas") refreshPreview(); };

(async () => {
  const [cr, sr] = await Promise.all([fetch("/api/candidates"), fetch("/api/selections")]);
  if (!cr.ok) { $("#main").replaceChildren(h("div", { class: "empty-state" }, (await cr.json()).error)); return; }
  C = await cr.json(); S = await sr.json();
  byUid = Object.fromEntries(C.suttas.map(c => [c.uid, c]));
  const fromHash = decodeURIComponent(location.hash.slice(1));
  current = byUid[fromHash] ? fromHash : C.suttas[0].uid;
  $("#save").textContent = "Saved to selections.json";
  render();
})();
</script>
</body>
</html>
