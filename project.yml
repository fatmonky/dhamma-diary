name: DhammaDiary
options:
  bundleIdPrefix: com.whitestone
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: T5LYL3TGLN
targets:
  DhammaDiary:
    type: application
    platform: iOS
    sources:
      - DhammaDiary
    dependencies:
      - target: DhammaDiaryWidget
    info:
      path: DhammaDiary/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.whitestone.DhammaDiary
            CFBundleURLSchemes: [dhammadiary]
        # No encryption beyond what iOS provides, so TestFlight doesn't ask each build.
        ITSAppUsesNonExemptEncryption: false
        # Always dark: light mode is too stimulating for an evening journal (PJ, 22 Nov 2026).
        UIUserInterfaceStyle: Dark
    entitlements:
      path: DhammaDiary/DhammaDiary.entitlements
      properties:
        com.apple.security.application-groups: [group.com.whitestone.DhammaDiary]
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.whitestone.DhammaDiary
        # iPhone only (spec 1). XcodeGen's default is iPhone and iPad, which
        # made the App Store ask for iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Dhamma Diary
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"DhammaDiary/Preview Content\""
        CODE_SIGN_STYLE: Automatic
  DhammaDiaryWidget:
    type: app-extension
    platform: iOS
    sources:
      - DhammaDiaryWidget
      # Shared with the app: tonight's passage is worked out the same way.
      - DhammaDiary/Models/Passage.swift
      - DhammaDiary/Utilities/PassageSequence.swift
      - DhammaDiary/Utilities/DateHelpers.swift
      # The widget's buttons queue taps for the app (spec 9.8).
      - DhammaDiary/Utilities/WidgetLogQueue.swift
      - DhammaDiary/Intents/WidgetIntents.swift
      - DhammaDiary/Resources/passages.json
      - DhammaDiary/Assets.xcassets
    info:
      path: DhammaDiaryWidget/Info.plist
      properties:
        CFBundleDisplayName: Dhamma Diary
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DhammaDiaryWidget/DhammaDiaryWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.whitestone.DhammaDiary]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitestone.DhammaDiary.Widget
        # iPhone only (spec 1). XcodeGen's default is iPhone and iPad, which
        # made the App Store ask for iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  DhammaDiaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DhammaDiaryTests
    dependencies:
      - target: DhammaDiary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whitestone.DhammaDiaryTests
        # iPhone only (spec 1). XcodeGen's default is iPhone and iPad, which
        # made the App Store ask for iPad screenshots.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
